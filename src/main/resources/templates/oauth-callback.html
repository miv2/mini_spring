<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 처리중</title>
  <style>
    body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; margin: 0; padding: 24px; }
    .card { max-width: 520px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
    .title { font-size: 18px; margin: 0 0 8px; }
    .desc { color: #6b7280; font-size: 13px; margin: 0 0 16px; }
    .row { font-size: 12px; word-break: break-all; background: #f9fafb; padding: 10px; border-radius: 8px; }
    .ok { color: #16a34a; }
    .warn { color: #b45309; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">로그인 처리중</h1>
    <p class="desc">토큰을 수신했습니다. 웹뷰라면 자동으로 앱이 처리하도록 구현하세요.</p>
    <div id="status" class="row">대기 중...</div>
  </div>

  <script>
    (function () {
      const status = document.getElementById('status');
      const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : '';
      if (!hash) {
        status.textContent = '토큰 정보가 없습니다.';
        status.className = 'row warn';
        return;
      }
      status.textContent = '토큰 수신 성공: ' + hash;
      status.className = 'row ok';
    })();
  </script>
</body>
</html>
