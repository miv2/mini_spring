server:
  forward-headers-strategy: framework

spring:
  application:
    name: mini_spring
  profiles:
    active: local # 기본값은 로컬

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 604800000 # 7일

cache:
  post:
    list-ttl-seconds: 60

springdoc:
  querydsl:
    enabled: false
  swagger-ui:
    defaultModelsExpandDepth: -1
    defaultModelExpandDepth: 0
    displayRequestDuration: true