server:
  forward-headers-strategy: framework

spring:
  application:
    name: mini_spring
  profiles:
    active: local # 기본 실행 환경 (로컬)

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always


jwt:
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 604800000 # 7일

cache:
  post:
    list-ttl-seconds: 60
    detail-ttl-seconds: 180

springdoc:
  querydsl:
    enabled: false
  swagger-ui:
    defaultModelsExpandDepth: -1
    defaultModelExpandDepth: 0
    displayRequestDuration: true
