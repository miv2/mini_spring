server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false # 운영 로그 최소화
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
    open-in-view: false

  security:
    oauth2:
      client:
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "${APP_BASE_URL}/login/oauth2/code/google"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope:
              - account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_BASE_URL}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post

logging:
  level:
    co.kr.mini_spring: INFO # 운영 로그 레벨
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

jwt:
  secret: ${JWT_SECRET}

management:
  health:
    redis:
      enabled: true

file:
  r2:
    endpoint: ${FILE_STORAGE_R2_ENDPOINT}
    access-key: ${FILE_STORAGE_R2_ACCESS_KEY}
    secret-key: ${FILE_STORAGE_R2_SECRET_KEY}
    bucket: ${FILE_STORAGE_R2_BUCKET}
    region: ${FILE_STORAGE_R2_REGION:auto}
    key-prefix: ${FILE_STORAGE_R2_KEY_PREFIX:}
  public-base-url: ${FILE_PUBLIC_BASE_URL:${APP_BASE_URL}/uploads/}
  default-profile-image: ${FILE_DEFAULT_PROFILE_IMAGE:/uploads/default-profile.png}

app:
  frontend-url: https://minireact.duckdns.org
